name: hrismdm

x-database-environment: &database-environment
  DATABASE_URL: postgres://${POSTGRES_USER:-hris}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-hris}?sslmode=disable

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hris}
      POSTGRES_DB: ${POSTGRES_DB:-hris}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      <<: *database-environment
      LISTEN_ADDR: 0.0.0.0:8080
      DEMO_SEED: ${DEMO_SEED:-false}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      FACE_PROVIDER_URL: ${FACE_PROVIDER_URL:-http://face:8000}
      FACE_PROVIDER_KEY: ${FACE_PROVIDER_KEY:?Set FACE_PROVIDER_KEY in .env}
    depends_on:
      postgres:
        condition: service_healthy
      face:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
  face:
    build: ./face-service
    restart: unless-stopped
    environment:
      FACE_PROVIDER_KEY: ${FACE_PROVIDER_KEY:?Set FACE_PROVIDER_KEY in .env}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend-test:
    profiles: ["test"]
    build:
      context: ./backend
      target: test
    environment:
      TEST_DATABASE_URL: postgres://hris_test:hris_test_local@postgres-test:5432/hris_test?sslmode=disable
    depends_on:
      postgres-test:
        condition: service_healthy

  postgres-test:
    profiles: ["test"]
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: hris_test
      POSTGRES_DB: hris_test
      POSTGRES_PASSWORD: hris_test_local
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hris_test -d hris_test"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
