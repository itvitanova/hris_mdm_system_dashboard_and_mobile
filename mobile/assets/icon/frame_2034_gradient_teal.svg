<svg width="344" height="194" viewBox="0 0 344 194" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Ambient Teal Glow Shadow -->
    <filter id="teal-tile-shadow" x="-5%" y="-15%" width="110%" height="145%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0D9488" flood-opacity="0.25" />
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.08" />
    </filter>

    <filter id="logout-teal-shadow" x="-5%" y="-15%" width="110%" height="145%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.06" />
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.03" />
    </filter>

    <!-- Dominant Teal Gradient (Active Hero Standard) -->
    <linearGradient id="primary-teal-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F766E" />
      <stop offset="100%" stop-color="#14B8A6" />
    </linearGradient>

    <style>
      .font-inter {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
    </style>
  </defs>

  <!-- ==================== ITEM 1: UBAH INFORMASI (GRADIENT TEAL) ==================== -->
  <g id="menu-ubah-informasi-teal" cursor="pointer">
    <!-- Base Surface (Dominant Teal Gradient) -->
    <rect x="8" y="8" width="328" height="54" rx="16" fill="url(#primary-teal-grad)" stroke="rgba(255, 255, 255, 0.45)" stroke-width="1.2" filter="url(#teal-tile-shadow)" />

    <!-- Frosted White Squircle Icon Container -->
    <g transform="translate(18, 16)">
      <rect width="38" height="38" rx="12" fill="rgba(255, 255, 255, 0.20)" stroke="rgba(255, 255, 255, 0.40)" stroke-width="1.2" />
      <!-- Lucide User Profile Vector (White Pure) -->
      <g stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <circle cx="19" cy="14" r="5" />
        <path d="M10 28.5C10 24.5 14 22.5 19 22.5C24 22.5 28 24.5 28 28.5" />
      </g>
    </g>

    <!-- Title Label -->
    <text x="68" y="40" class="font-inter" font-size="14.5" font-weight="700" fill="#FFFFFF" letter-spacing="-0.2">Ubah Informasi</text>

    <!-- Navigation Chevron Right -->
    <path d="M310 30L315 35L310 40" stroke="rgba(255, 255, 255, 0.85)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- ==================== ITEM 2: UBAH PASSWORD (GRADIENT TEAL) ==================== -->
  <g id="menu-ubah-password-teal" cursor="pointer" transform="translate(0, 62)">
    <!-- Base Surface (Dominant Teal Gradient) -->
    <rect x="8" y="8" width="328" height="54" rx="16" fill="url(#primary-teal-grad)" stroke="rgba(255, 255, 255, 0.45)" stroke-width="1.2" filter="url(#teal-tile-shadow)" />

    <!-- Frosted White Squircle Icon Container -->
    <g transform="translate(18, 16)">
      <rect width="38" height="38" rx="12" fill="rgba(255, 255, 255, 0.20)" stroke="rgba(255, 255, 255, 0.40)" stroke-width="1.2" />
      <!-- Lucide Lock / Security Vector (White Pure) -->
      <g stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <rect x="12" y="16.5" width="14" height="11" rx="2.5" />
        <path d="M15 16.5V13.5C15 11.3 16.8 9.5 19 9.5C21.2 9.5 23 11.3 23 13.5V16.5" />
        <circle cx="19" cy="22" r="1.2" fill="#FFFFFF" stroke="none" />
      </g>
    </g>

    <!-- Title Label -->
    <text x="68" y="40" class="font-inter" font-size="14.5" font-weight="700" fill="#FFFFFF" letter-spacing="-0.2">Ubah Password</text>

    <!-- Navigation Chevron Right -->
    <path d="M310 30L315 35L310 40" stroke="rgba(255, 255, 255, 0.85)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- ==================== ITEM 3: KELUAR (HIGH-CONTRAST DANGER SURFACE) ==================== -->
  <g id="menu-keluar-teal" cursor="pointer" transform="translate(0, 124)">
    <!-- Base Surface: Clean Surface with Coral Red Accent -->
    <rect x="8" y="8" width="328" height="54" rx="16" fill="#FFFFFF" stroke="#FECDD3" stroke-width="1.2" filter="url(#logout-teal-shadow)" />

    <!-- Squircle Icon: Soft Red -->
    <g transform="translate(18, 16)">
      <rect width="38" height="38" rx="12" fill="#FEF2F2" stroke="#FECDD3" stroke-width="1.2" />
      <!-- Lucide Log-Out Vector -->
      <g stroke="#ED2736" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M19 10.5H13C11.9 10.5 11 11.4 11 12.5V25.5C11 26.6 11.9 27.5 13 27.5H19" />
        <path d="M22 22.5L26 19L22 15.5" />
        <line x1="16" y1="19" x2="26" y2="19" />
      </g>
    </g>

    <!-- Title Label -->
    <text x="68" y="40" class="font-inter" font-size="14.5" font-weight="700" fill="#DC2626" letter-spacing="-0.2">Keluar</text>

    <!-- Navigation Chevron Right -->
    <path d="M310 30L315 35L310 40" stroke="#FCA5A5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
