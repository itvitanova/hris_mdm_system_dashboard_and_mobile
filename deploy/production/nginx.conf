server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name hris.mdmcorp.co.id hrms.mdmcorp.co.id 43.173.20.104;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://hris.mdmcorp.co.id$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hris.mdmcorp.co.id;
    ssl_certificate /etc/letsencrypt/live/hris.mdmcorp.co.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hris.mdmcorp.co.id/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:HRISTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    server_tokens off;
    client_max_body_size 8m;
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    location = /downloads/mdm-hr-latest-arm64.apk {
        return 302 /downloads/mdm-hr-1.2.0-arm64.apk;
    }
    location = /downloads/mdm-hr-latest-armv7.apk {
        return 302 /downloads/mdm-hr-1.2.0-armv7.apk;
    }
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 150s;
        proxy_send_timeout 150s;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hrms.mdmcorp.co.id;
    ssl_certificate /etc/letsencrypt/live/hrms.mdmcorp.co.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hrms.mdmcorp.co.id/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://hris.mdmcorp.co.id$request_uri;
}
